<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
<rect width="760" height="420" fill="#ffffff"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#171717">
  <text x="380" y="38" text-anchor="middle" font-size="23">Rutherford scattering</text>
  <line x1="65" y1="225" x2="700" y2="225" stroke="#cfcfcf" stroke-width="1.5" stroke-dasharray="7 7"/>

  <!-- Incoming trajectory above the nucleus, then deflected farther upward by repulsion. -->
  <path d="M80 145 C235 145 322 145 377 169 C414 185 438 180 470 145 C520 91 584 52 690 42"
        fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>

  <!-- Direction arrows -->
  <path d="M225 145 L241 139 L235 145 L241 151 Z" fill="#2563eb"/>
  <path d="M655 46 L673 42 L662 54 Z" fill="#2563eb"/>

  <circle cx="420" cy="225" r="7" fill="#111111"/>
  <text x="438" y="220" font-size="15">nucleus</text>

  <!-- Impact parameter: distance between incoming asymptote and nucleus. -->
  <line x1="95" y1="145" x2="95" y2="225" stroke="#777777" stroke-width="1.4"/>
  <line x1="89" y1="145" x2="101" y2="145" stroke="#777777" stroke-width="1.4"/>
  <line x1="89" y1="225" x2="101" y2="225" stroke="#777777" stroke-width="1.4"/>
  <text x="82" y="189" text-anchor="end" font-size="16" font-style="italic">b</text>

  <text x="380" y="385" text-anchor="middle" font-size="14">b &gt; 0</text>
</g>
</svg>